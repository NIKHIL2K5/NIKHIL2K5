<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 115" width="100%">
  <defs>
    <!-- Card Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Animated Shifting Neon Border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#7c3aed;#3455ff;#00d9ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#00d9ff;#f43f5e;#8a2be2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#7c3aed;#3455ff;#00d9ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer for Text -->
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#a78bfa;#67e8f9" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Glowing Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Terminal Window Background & Animated Neon Border -->
  <rect x="2" y="2" width="846" height="111" rx="12" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="1.8"/>

  <!-- Top Window Header Bar -->
  <line x1="2" y1="36" x2="848" y2="36" stroke="#172554" stroke-opacity="0.6" stroke-width="1"/>

  <!-- macOS Window Dots -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="39" cy="19" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="56" cy="19" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Title -->
  <text class="mono" x="78" y="23" fill="#64748b" font-size="11" font-weight="600">
    nikhil@workstation: <tspan fill="#38bdf8">~/farewell.c</tspan>
  </text>

  <!-- Live Pulse Beacon & Status Pill -->
  <g transform="translate(640, 9)">
    <rect x="0" y="0" width="195" height="20" rx="10" fill="#06221d" stroke="#10b981" stroke-width="0.8"/>
    <!-- Pulsing Radar Dot -->
    <circle cx="14" cy="10" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="10" r="6" fill="none" stroke="#10b981" stroke-width="1">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="28" y="14" fill="#34d399" font-size="9.5" font-weight="700" letter-spacing="0.5">
      STATUS: READY TO BUILD
    </text>
  </g>

  <!-- Main Terminal Output: printf Command -->
  <g transform="translate(24, 66)">
    <!-- Shell Prompt Indicator -->
    <text class="mono" x="0" y="0" font-size="14.5" font-weight="700">
      <tspan fill="#00d9ff">➜</tspan>
      <tspan fill="#64748b"> ~ </tspan>
      <!-- Syntax Highlighted printf -->
      <tspan fill="#c084fc">printf</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="url(#textGlow)" filter="url(#glow)">"Thanks for visiting. Let's build something meaningful.\n"</tspan><tspan fill="#e2e8f0">);</tspan>
      <!-- Animated Blinking Cursor -->
      <tspan fill="#00d9ff"> █<animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/></tspan>
    </text>
  </g>

  <!-- Secondary Terminal Line: Output / Subtitle -->
  <g transform="translate(42, 94)">
    <text class="mono" x="0" y="0" font-size="12" fill="#94a3b8">
      <tspan fill="#3455ff">»</tspan>
      <tspan fill="#cbd5e1"> Process returned </tspan>
      <tspan fill="#10b981" font-weight="700">0 (SUCCESS)</tspan>
      <tspan fill="#64748b"> — </tspan>
      <tspan fill="#94a3b8">Open for collaborations, discussions &amp; high-impact products 🚀</tspan>
    </text>
  </g>

  <!-- Bottom Animated Energy Beam -->
  <line x1="100" y1="113" x2="300" y2="113" stroke="url(#beamGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x1" values="50;550;50" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="250;750;250" dur="4.5s" repeatCount="indefinite"/>
  </line>
</svg>
