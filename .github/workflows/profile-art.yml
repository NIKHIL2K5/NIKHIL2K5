name: Update Profile Art

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_art.py"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Generate custom profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_art.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update generated profile art"
          file_pattern: "contrib-heatmap.svg stats.svg nikhil-ascii.svg"
