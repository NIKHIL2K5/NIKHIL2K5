<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="50%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="itemBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141f36" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="loopGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .term-title { fill: #94a3b8; font-size: 13px; font-weight: 600; }
    .bio { fill: #cbd5e1; font-size: 13.5px; font-weight: 400; }
    .bio-highlight { fill: #00d9ff; font-weight: 600; }
    .card-title { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    .card-desc { fill: #94a3b8; font-size: 11.5px; font-weight: 400; }
    .loop-text { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .tag-text { font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
  </style>

  <!-- Outer Terminal Window Frame -->
  <rect x="1" y="1" width="848" height="398" rx="12" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 1,13 A 12,12 0 0 1 13,1 L 837,1 A 12,12 0 0 1 849,13 L 849,38 L 1,38 Z" fill="url(#titleBg)" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS Control Buttons -->
  <circle cx="22" cy="19" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="40" cy="19" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="58" cy="19" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Title Prompt -->
  <text class="font-mono term-title" x="84" y="24">
    <tspan fill="#00d9ff" font-weight="bold">nikhil@github</tspan>
    <tspan fill="#64748b">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~</tspan>
    <tspan fill="#f43f5e" font-weight="bold">$ </tspan>
    <tspan fill="#f8fafc" font-weight="bold">cat about-me.md</tspan>
  </text>

  <!-- Pill Badge on Right -->
  <rect x="705" y="8" width="125" height="24" rx="12" fill="#0e1e36" stroke="#00d9ff" stroke-width="1"/>
  <text class="font-sans tag-text" x="767" y="24" text-anchor="middle">📖 ABOUT ME</text>

  <!-- Top Bio Text -->
  <text class="font-sans bio" x="24" y="66">
    I'm <tspan class="bio-highlight">Nikhil</tspan>, a developer and product builder who enjoys taking ideas from a rough sketch to useful software.
  </text>
  <text class="font-sans bio" x="24" y="86" fill="#94a3b8" font-size="12.5px">
    I build across <tspan fill="#38bdf8">web, mobile, and AI/ML</tspan>, contribute to open source, and work as a freelancer.
  </text>

  <!-- Row 1 -->
  <!-- Card 1: Full Stack -->
  <g transform="translate(24, 108)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#1e3a5f" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#38bdf8">🧩 Full-Stack Engineering</text>
    <text class="font-mono card-desc" x="16" y="48">MERN · TypeScript · REST APIs · SQL · PostgreSQL</text>
  </g>

  <!-- Card 2: Mobile -->
  <g transform="translate(438, 108)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#2b2d68" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#818cf8">📱 Mobile Development</text>
    <text class="font-mono card-desc" x="16" y="48">Cross-Platform Apps with React Native &amp; Flutter</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 3: AI/ML -->
  <g transform="translate(24, 186)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#3b1f5e" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#c084fc">🤖 AI / Machine Learning</text>
    <text class="font-mono card-desc" x="16" y="48">AI-Powered Applications · ML Experiments · Dev Tools</text>
  </g>

  <!-- Card 4: Product Building -->
  <g transform="translate(438, 186)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#134e4a" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#34d399">🚀 Product Building</text>
    <text class="font-mono card-desc" x="16" y="48">Prototyping · Shipping · Deployment · Iteration</text>
  </g>

  <!-- Row 3 -->
  <!-- Card 5: Open Source -->
  <g transform="translate(24, 264)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#4d3800" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#fbbf24">🌱 Open Source &amp; Freelance</text>
    <text class="font-mono card-desc" x="16" y="48">Collaborative Development · Turning Ideas into Software</text>
  </g>

  <!-- Card 6: Experience -->
  <g transform="translate(438, 264)">
    <rect width="388" height="66" rx="8" fill="url(#itemBg)" stroke="#4c1d2f" stroke-width="1"/>
    <text class="font-sans card-title" x="16" y="26" fill="#fb7185">🏢 Industry Experience</text>
    <text class="font-mono card-desc" x="16" y="48">Former Intern at Eglogics (Noida)</text>
  </g>

  <!-- Bottom Dev Workflow Loop -->
  <g transform="translate(24, 346)">
    <rect width="802" height="34" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1"/>
    <text class="font-mono loop-text" x="401" y="22" fill="url(#loopGradient)" text-anchor="middle">
      BUILD  ➜  LEARN  ➜  CONTRIBUTE  ➜  SHIP  ➜  REPEAT
    </text>
  </g>
</svg>
