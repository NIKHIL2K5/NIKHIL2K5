<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%">
  <defs>
    <!-- Dynamic Shimmer Gradient for Advanced Text Animation -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#a855f7;#3b82f6;#00d9ff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#00d9ff;#a855f7;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#3b82f6;#00d9ff;#8a2be2" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#a855f7;#3b82f6;#00d9ff" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Underline Gradient -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .whoami-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-anchor: middle;
    }
    .bracket {
      fill: #00d9ff;
      font-weight: 300;
      opacity: 0.8;
    }
    .subtitle {
      font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #8b949e;
      text-anchor: middle;
      text-transform: uppercase;
    }
  </style>

  <!-- Advanced Animated Text -->
  <text x="400" y="44" class="whoami-title" fill="url(#textShimmer)" filter="url(#neonGlow)">
    <tspan class="bracket">&lt; </tspan>WHO AM I<tspan class="bracket"> /&gt;</tspan>
  </text>

  <!-- Subtitle -->
  <text x="400" y="64" class="subtitle">System Identity &amp; Developer Profile</text>

  <!-- Animated Glowing Expanding Underline -->
  <line x1="260" y1="74" x2="540" y2="74" stroke="url(#glowLine)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="320;220;320" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" values="480;580;480" dur="4s" repeatCount="indefinite" />
  </line>
</svg>
