<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="100%">
  <defs>
    <linearGradient id="statsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="statsBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .user { fill: #00d9ff; font-weight: 700; font-size: 14px; }
    .punct { fill: #64748b; font-size: 14px; }
    .path { fill: #a855f7; font-weight: 700; font-size: 14px; }
    .dollar { fill: #f43f5e; font-weight: 700; font-size: 14px; }
    .cmd { fill: #f8fafc; font-weight: 700; font-size: 14px; }
    .cursor { fill: #00d9ff; font-size: 14px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #00d9ff; letter-spacing: 0.5px; }
  </style>

  <!-- Terminal Window Bar Frame -->
  <rect x="1" y="1" width="848" height="54" rx="10" fill="url(#statsBg)" stroke="url(#statsBorder)" stroke-width="1.5"/>

  <!-- macOS Control Dots -->
  <circle cx="22" cy="28" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="40" cy="28" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="58" cy="28" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Command -->
  <text class="mono" x="84" y="33">
    <tspan class="user">nikhil@github</tspan>
    <tspan class="punct">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="dollar">$ </tspan>
    <tspan class="cmd">./stats.sh</tspan>
    <tspan class="cursor"> █<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- Tag Pill -->
  <rect x="670" y="15" width="160" height="26" rx="13" fill="#0d1b30" stroke="#00d9ff" stroke-width="1"/>
  <text class="tag-text" x="750" y="32" text-anchor="middle">📊 GITHUB STATS &amp; STREAK</text>
</svg>
