<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="50%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .title { fill: #94a3b8; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
    .prompt-user { fill: #00d9ff; font-weight: 700; font-size: 13.5px; }
    .prompt-sym { fill: #64748b; font-size: 13.5px; }
    .prompt-path { fill: #a855f7; font-weight: 700; font-size: 13.5px; }
    .prompt-dollar { fill: #f43f5e; font-weight: 700; font-size: 13.5px; }
    .cmd { fill: #f8fafc; font-weight: 600; font-size: 13.5px; }
    .arrow { fill: #00d9ff; font-weight: bold; font-size: 13.5px; }
    .name { fill: #ffffff; font-weight: 700; font-size: 13.5px; }
    .role-bracket { fill: #475569; font-size: 12px; }
    .role1 { fill: #38bdf8; font-weight: 600; font-size: 12px; }
    .role2 { fill: #818cf8; font-weight: 600; font-size: 12px; }
    .role3 { fill: #c084fc; font-weight: 600; font-size: 12px; }
    .role4 { fill: #34d399; font-weight: 600; font-size: 12px; }
    .sep { fill: #475569; font-size: 12px; }
    .key { fill: #fb7185; font-size: 12.5px; }
    .str { fill: #a7f3d0; font-size: 12.5px; }
    .punct { fill: #94a3b8; font-size: 12.5px; }
    .status-text { fill: #34d399; font-weight: 500; font-size: 12.5px; }
    .cursor { fill: #00d9ff; font-size: 14px; font-weight: bold; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="848" height="218" rx="12" fill="url(#termBg)" stroke="url(#neonBorder)" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 1,13 A 12,12 0 0 1 13,1 L 837,1 A 12,12 0 0 1 849,13 L 849,36 L 1,36 Z" fill="url(#titleBg)" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="1" y1="36" x2="849" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="58" cy="18" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Header Title -->
  <text class="mono title" x="425" y="23" text-anchor="middle">⚡ nikhil@github:~ (whoami)</text>

  <!-- Line 1: whoami -->
  <text class="mono" x="22" y="64">
    <tspan class="prompt-user">nikhil@github</tspan>
    <tspan class="prompt-sym">:</tspan>
    <tspan class="prompt-path">~</tspan>
    <tspan class="prompt-dollar">$ </tspan>
    <tspan class="cmd">whoami</tspan>
  </text>

  <!-- Line 2: whoami output -->
  <text class="mono" x="22" y="88">
    <tspan class="arrow">➜ </tspan>
    <tspan class="name">Nikhil</tspan>
    <tspan class="role-bracket"> [ </tspan>
    <tspan class="role1">Full-Stack Developer</tspan>
    <tspan class="sep"> · </tspan>
    <tspan class="role2">Mobile App Developer</tspan>
    <tspan class="sep"> · </tspan>
    <tspan class="role3">AI/ML Builder</tspan>
    <tspan class="sep"> · </tspan>
    <tspan class="role4">Product Builder</tspan>
    <tspan class="role-bracket"> ]</tspan>
  </text>

  <!-- Line 3: cat mission.json -->
  <text class="mono" x="22" y="122">
    <tspan class="prompt-user">nikhil@github</tspan>
    <tspan class="prompt-sym">:</tspan>
    <tspan class="prompt-path">~</tspan>
    <tspan class="prompt-dollar">$ </tspan>
    <tspan class="cmd">cat mission.json</tspan>
  </text>

  <!-- Line 4: JSON response -->
  <text class="mono" x="22" y="146">
    <tspan class="arrow">➜ </tspan>
    <tspan class="punct">{ </tspan>
    <tspan class="key">"philosophy"</tspan><tspan class="punct">: </tspan><tspan class="str">"Building products, not just projects"</tspan><tspan class="punct">, </tspan>
    <tspan class="key">"status"</tspan><tspan class="punct">: </tspan><tspan class="str">"shipping code 🚀"</tspan>
    <tspan class="punct"> }</tspan>
  </text>

  <!-- Line 5: ./status.sh -->
  <text class="mono" x="22" y="180">
    <tspan class="prompt-user">nikhil@github</tspan>
    <tspan class="prompt-sym">:</tspan>
    <tspan class="prompt-path">~</tspan>
    <tspan class="prompt-dollar">$ </tspan>
    <tspan class="cmd">./status.sh</tspan>
  </text>

  <!-- Line 6: status message + animated blinking cursor -->
  <text class="mono" x="22" y="202">
    <tspan class="arrow">➜ </tspan>
    <tspan class="status-text">Available for freelance contracts, internships &amp; collaborative builds</tspan>
    <tspan class="cursor"> █<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
  </text>
</svg>
